name: Zira

on:
  push:
    paths: ['zira/**', '.github/workflows/zira.yml']
  pull_request:
    paths: ['zira/**', '.github/workflows/zira.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zira-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zira
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zira/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: zira/dist

  # Publishes the site to GitHub Pages from main only.
  # One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
